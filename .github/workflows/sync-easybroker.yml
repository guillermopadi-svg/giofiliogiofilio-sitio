name: Sincronizar inventario EasyBroker

on:
  schedule:
    # 12:00 UTC = 6:00 AM hora Ciudad de México (todo el año, México ya no aplica horario de verano)
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sincronizar propiedades desde EasyBroker
        working-directory: _generador
        env:
          EASYBROKER_API_KEY: ${{ secrets.EASYBROKER_API_KEY }}
        run: python3 sync_easybroker.py

      - name: Reconstruir el sitio
        working-directory: _generador
        run: python3 build.py

      - name: Publicar cambios si hay inventario nuevo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios en el inventario, no se publica nada."
          else
            git commit -m "Sincronización automática de inventario (EasyBroker)"
            git push
          fi
